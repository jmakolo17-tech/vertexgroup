              <span className="file-zone-icon">↑</span>

              <div style={{display:'flex',gap:'0.8rem',alignItems:'flex-start'}}>

              <div style={{display:'flex',gap:'0.8rem',alignItems:'flex-start'}}>
                <span style={{border:'1px solid var(--grey-700)',color:'var(--grey-400)',fontSize:'0.58rem',padding:'0.2rem 0.45rem',fontFamily:'DM Mono,monospace',letterSpacing:'0.06em',flexShrink:0,marginTop:2}}>{isFr?'PRO':'PRO'}</span>

              </div>
              <div>
                <div style={{fontSize:'0.75rem',fontWeight:600,color:'#1a1a18'}}>Sanjay Pillay</div>
                <div style={{fontSize:'0.65rem',color:'#787774',fontFamily:'DM Mono,monospace',letterSpacing:'0.04em'}}>MD · Meridian Retail</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

// ── NEWSLETTER SECTION ────────────────────────────────────────────
function NewsletterSection({ t }) {
  const [email, setEmail] = useState('');
  const [name, setName] = useState('');
  const [subscribed, setSubscribed] = useState(false);
  const [loading, setLoading] = useState(false);

  const handleSubscribe = async () => {
    if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return;
    setLoading(true);
    try {
      await apiPost('/api/newsletter/subscribe', {
        email,
        name,
        language: window.__VERTEX_LANG__ || 'en',
      });
    } catch { /* silent — UI still shows success */ }
    setLoading(false);
    setSubscribed(true);
  };

  return (
    <div className="newsletter-section">
      <div className="newsletter-left">
        <div className="section-label">{t.newsletter_label}</div>
        <h2 className="newsletter-title">{t.newsletter_title}</h2>
        <p className="newsletter-sub">{t.newsletter_sub}</p>
        <div className="newsletter-topics">
          <span style={{fontSize:'0.68rem',color:'var(--grey-500)',fontFamily:'DM Mono,monospace',letterSpacing:'0.1em',textTransform:'uppercase',marginRight:'0.3rem'}}>{t.newsletter_topics_label}</span>
          {t.newsletter_topics.map(tp => <span key={tp} className="newsletter-topic">{tp}</span>)}
        </div>
      </div>
      <div className="newsletter-right">
        {subscribed ? (
          <div className="newsletter-success">
            <span className="newsletter-success-icon">✦</span>
            <span>{t.newsletter_success}</span>
          </div>
        ) : (
          <div className="newsletter-form">
            <div className="newsletter-input-row">
              <input
                className="newsletter-input"
                type="text"
                placeholder={t.newsletter_name_placeholder}
                value={name}
                onChange={e => setName(e.target.value)}
                style={{borderRight:'1px solid var(--grey-700)',marginBottom:0,borderBottom:'none'}}
              />
            </div>
            <div className="newsletter-input-row">
              <input
                className="newsletter-input"
                type="email"
                placeholder={t.newsletter_placeholder}
                value={email}
                onChange={e => setEmail(e.target.value)}
                onKeyDown={e => e.key === 'Enter' && handleSubscribe()}
              />
              <button className="newsletter-btn" onClick={handleSubscribe} disabled={loading||!email}>
                {loading ? '...' : t.newsletter_btn}
              </button>
            </div>
            <div className="newsletter-disclaimer">{t.newsletter_disclaimer}</div>
          </div>
        )}
        {/* Social links */}
        <div style={{marginTop:'2.5rem'}}>
          <div style={{fontFamily:'DM Mono,monospace',fontSize:'0.62rem',letterSpacing:'0.2em',color:'var(--grey-500)',textTransform:'uppercase',marginBottom:'1rem'}}>{t.social_label}</div>
          <div className="social-row">
            <a href="https://www.instagram.com/vertexgroup.africa" target="_blank" rel="noopener noreferrer" className="social-btn">
              <IconInstagram/> {t.social_instagram}
            </a>
            <a href="https://www.linkedin.com/company/vertexgroup-africa" target="_blank" rel="noopener noreferrer" className="social-btn">
              <IconLinkedIn/> {t.social_linkedin}
            </a>
          </div>
          <div style={{marginTop:'0.8rem',fontSize:'0.68rem',color:'var(--grey-500)',fontFamily:'DM Mono,monospace',letterSpacing:'0.06em'}}>{t.social_follow}</div>

}

          {/* Contact column */}
          <div>
            <div className="footer-col-title">{isFr ? 'Contact' : 'Contact'}</div>
            <ul className="footer-col-links">
              <li><button onClick={() => go('contact')} style={{color:'var(--grey-500)'}}>info@vertexgroup.africa</button></li>
              <li><button onClick={() => go('contact')} style={{color:'var(--grey-500)'}}>vertexgroup.africa</button></li>
              <li style={{marginTop:'0.8rem'}}>
                <button onClick={() => go('diagnosis')}
                  style={{background:'var(--cta)',color:'var(--white)',border:'none',padding:'0.6rem 1rem',fontSize:'0.7rem',letterSpacing:'0.1em',textTransform:'uppercase',fontWeight:500,cursor:'pointer',transition:'background 0.2s'}}>
                  {isFr ? 'Diagnostic gratuit' : 'Free Diagnosis'}
                </button>
              </li>
            </ul>
          </div>
        </div>

        <div className="footer-bottom">
          <div className="footer-copy">© 2025 Vertex Group · 155 West St, Sandown, Johannesburg · {CONTACT_EMAIL} · {SITE_DOMAIN}</div>
          <div className="footer-legal">
            <span>{isFr ? 'Tous droits réservés' : 'All rights reserved'}</span>
            <span>·</span>
            <span>{isFr ? 'Politique de confidentialité' : 'Privacy Policy'}</span>
          </div>
        </div>
      </footer>

      {detectedLang && detectedLang !== lang && !langNoticeDismissed && (
        <LangNotice
          detectedLang={detectedLang}
          currentLang={lang}
          t={t}
          onSwitch={handleLangSwitch}
          onDismiss={() => setLangNoticeDismissed(true)}
        />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
